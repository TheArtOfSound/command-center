name: Grok Control CI

on:
  push:
    branches:
      - feature/grok-ops-control-plane
    paths:
      - "grok-control/**"
      - ".github/workflows/grok-control-ci.yml"
  pull_request:
    paths:
      - "grok-control/**"
      - ".github/workflows/grok-control-ci.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: grok-control
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile server.py workspace_server.py
      - run: python -m json.tool projects.json > /dev/null
      - name: Validate embedded browser JavaScript
        run: |
          node - <<'NODE'
          const fs = require('fs');
          for (const filename of ['index.html', 'setup.html']) {
            const html = fs.readFileSync(filename, 'utf8');
            const match = html.match(/<script>([\s\S]*)<\/script>/);
            if (!match) throw new Error(`No script block found in ${filename}`);
            new Function(match[1]);
            console.log(`${filename} JavaScript syntax is valid`);
          }
          NODE
      - name: Import FastAPI app and project registry
        run: |
          python - <<'PY'
          import workspace_server
          projects = workspace_server.core.defs()
          assert workspace_server.app.title == 'Qira Grok Ops'
          assert len(projects) >= 18
          assert projects[1]['id'] == 'ah-crap'
          assert workspace_server.config_payload()['workspace_root']
          print(f'Validated {len(projects)} project definitions')
          PY
